[project]
name = "personal-weather"
version = "0.1.0"
description = "A small bilingual command-line weather tool."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
weather = "weather.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weather"]
